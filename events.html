<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>宣讲会 · 招聘信息聚合</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/events.css">
  <script>
    /* 先于样式渲染应用主题与宽度，避免刷新时闪动 */
    (function () {
      try {
        var t = localStorage.getItem('site-theme');
        if (t) document.documentElement.setAttribute('data-theme', t);
        var w = localStorage.getItem('site-width');
        if (w) document.documentElement.setAttribute('data-width', w);
      } catch (e) { /* 隐私模式下 localStorage 不可用，忽略 */ }
    })();
  </script>
</head>
<body>

  <header class="site-header">
    <div class="container header-inner">
      <a class="brand" href="./" aria-label="招聘信息聚合首页">
        <span class="brand-logo" aria-hidden="true">招</span>
        <span class="brand-name">招聘信息聚合</span>
      </a>
      <nav class="site-nav" aria-label="板块导航">
        <a href="./">岗位</a>
        <a href="events.html" class="active" aria-current="page">宣讲会</a>
      </nav>
      <div class="header-side">
        <button id="widthBtn" class="theme-btn" type="button" title="内容区宽度">
          <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 12h18"></path><path d="M7 8l-4 4 4 4"></path><path d="M17 8l4 4-4 4"></path></svg>
          <span id="widthLabel">宽屏</span>
        </button>
        <div class="theme-switcher">
          <button id="themeBtn" class="theme-btn" type="button" aria-haspopup="true" aria-expanded="false">
            <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="13.5" cy="6.5" r="2.5"></circle><circle cx="17.5" cy="10.5" r="2.5"></circle><circle cx="8.5" cy="7.5" r="2.5"></circle><circle cx="6.5" cy="12.5" r="2.5"></circle><path d="M12 22a10 10 0 1 1 0-20c.9 0 1.8.1 2.6.4 1 .3 1.2 1.6.4 2.2a4 4 0 0 0 5.6 5.6c.6-.8 1.9-.6 2.2.4.3.8.2 1.7.2 2.6 0 4.4-3.6 8-8 8z"></path></svg>
            <span id="themeLabel">主题</span>
          </button>
          <div id="themeMenu" class="theme-menu" role="menu"></div>
        </div>
      </div>
    </div>
  </header>

  <section class="events-hero">
    <div class="container">
      <h1>校招宣讲会 &amp; 招聘会</h1>
      <!-- 更新日期随 data/events.json 一起手动维护，别改成动态当天日期 -->
      <p class="events-sub">2027 届 ｜ 浙工商及周边 ｜ 更新于 <span id="updatedAt">2026-10-29</span></p>
    </div>
  </section>

  <main class="container events-main">
    <div id="eventsList" class="events-list"></div>
    <div id="emptyEvents" class="empty-state" style="display:none;">
      <div class="empty-icon">—</div>
      <p>暂无宣讲会信息</p>
    </div>
  </main>

  <footer class="footer">
    <div class="container"></div>
  </footer>

  <script src="data/events.js"></script>
  <script src="js/theme.js"></script>
  <script src="js/layout.js"></script>
  <script src="js/events.js"></script>
</body>
</html>
