<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>招聘信息聚合</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <!-- 顶栏：品牌 + 搜索 + 移动端筛选入口 -->
  <header class="site-header">
    <div class="container header-inner">
      <a class="brand" href="./" aria-label="招聘信息聚合首页">
        <span class="brand-logo" aria-hidden="true">招</span>
        <span class="brand-name">招聘信息聚合</span>
      </a>
      <div class="header-search">
        <svg class="search-icon" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <circle cx="11" cy="11" r="7"></circle>
          <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
        </svg>
        <input type="text" id="searchInput" class="search-input" placeholder="搜索公司、职位、关键词…" autocomplete="off">
      </div>
      <div class="header-side">
        <span class="site-subtitle">会计专硕2401专用</span>
        <button id="addJobBtn" class="add-job-btn" type="button" style="display:none;">+ 新增</button>
        <button id="filterToggle" class="filter-toggle" type="button" aria-label="打开筛选">筛选</button>
      </div>
    </div>
  </header>

  <!-- 顶部统计 + 城市条 -->
  <section class="stats-bar">
    <div class="container stats-bar-inner">
      <div class="stats-counts">
        共 <strong id="jobCount">0</strong> 个岗位 · <strong id="companyCount">0</strong> 家公司
      </div>
      <div id="cityBar" class="city-bar" aria-label="地点快捷筛选">
        <!-- JS 渲染城市 chips -->
      </div>
    </div>
  </section>

  <!-- 主体双栏 -->
  <main class="layout container">
    <!-- 左：筛选侧栏（移动端 1024px 以下转为底部抽屉） -->
    <aside id="sidebar" class="sidebar" aria-label="筛选条件">
      <div class="sidebar-header">
        <span class="sidebar-title">筛选</span>
        <button id="clearFilters" class="clear-filters" type="button">重置</button>
      </div>

      <div class="filter-group" data-group="type">
        <h4 class="filter-title">招聘类型</h4>
        <div id="typeOptions" class="filter-options"></div>
      </div>

      <div class="filter-group" data-group="industry">
        <h4 class="filter-title">行业</h4>
        <div id="industryOptions" class="filter-options"></div>
      </div>

      <div class="filter-group" data-group="position">
        <h4 class="filter-title">岗位分类</h4>
        <div id="positionOptions" class="filter-options filter-options-scroll"></div>
      </div>
    </aside>

    <div class="sidebar-backdrop" data-sidebar-close></div>

    <!-- 右：职位列表 -->
    <section class="list-pane">
      <div class="list-toolbar">
        <div id="activeFilters" class="active-filters"></div>
        <div class="toolbar-right">
          <!-- 视图切换器 -->
          <div id="viewSwitcher" class="view-switcher" aria-label="切换视图">
            <button type="button" class="view-btn active" data-view="compact" title="紧凑列表">
              <svg viewBox="0 0 20 20" width="16" height="16" fill="currentColor"><rect x="2" y="3" width="16" height="3" rx="1"/><rect x="2" y="8.5" width="16" height="3" rx="1"/><rect x="2" y="14" width="16" height="3" rx="1"/></svg>
              <span class="view-btn-label">列表</span>
            </button>
            <button type="button" class="view-btn" data-view="board" title="看板视图">
              <svg viewBox="0 0 20 20" width="16" height="16" fill="currentColor"><rect x="1" y="2" width="5" height="16" rx="1"/><rect x="7.5" y="2" width="5" height="12" rx="1"/><rect x="14" y="2" width="5" height="10" rx="1"/></svg>
              <span class="view-btn-label">看板</span>
            </button>
            <button type="button" class="view-btn" data-view="table" title="表格视图">
              <svg viewBox="0 0 20 20" width="16" height="16" fill="currentColor"><rect x="1" y="2" width="18" height="4" rx="1"/><rect x="1" y="7.5" width="8" height="3" rx="1"/><rect x="11" y="7.5" width="8" height="3" rx="1"/><rect x="1" y="12" width="8" height="3" rx="1"/><rect x="11" y="12" width="8" height="3" rx="1"/><rect x="1" y="16.5" width="8" height="3" rx="1" opacity=".5"/><rect x="11" y="16.5" width="8" height="3" rx="1" opacity=".5"/></svg>
              <span class="view-btn-label">表格</span>
            </button>
            <button type="button" class="view-btn" data-view="timeline" title="时间线视图">
              <svg viewBox="0 0 20 20" width="16" height="16" fill="currentColor"><rect x="9" y="1" width="2" height="18" rx="1"/><circle cx="10" cy="5" r="2.5"/><circle cx="10" cy="11" r="2.5"/><circle cx="10" cy="17" r="2.5"/><rect x="13" y="4" width="6" height="2" rx="1"/><rect x="13" y="10" width="6" height="2" rx="1"/><rect x="13" y="16" width="6" height="2" rx="1"/></svg>
              <span class="view-btn-label">时间线</span>
            </button>
          </div>
          <!-- 看板分组选择（仅看板视图可见） -->
          <div id="groupByControl" class="group-by-control" style="display:none;">
            <label class="sort-label" for="groupBySelect">分组</label>
            <select id="groupBySelect" class="sort-select">
              <option value="company">公司</option>
              <option value="type">招聘类型</option>
              <option value="industry">行业</option>
              <option value="position">岗位分类</option>
            </select>
          </div>
        </div>
      </div>
      <!-- 排序（独立行，视图切换不受影响） -->
      <div class="list-toolbar-secondary">
        <div class="sort-control">
          <label class="sort-label" for="sortSelect">排序</label>
          <select id="sortSelect" class="sort-select">
            <option value="default">综合排序</option>
            <option value="newest">最新发布</option>
          </select>
        </div>
        <!-- 个人进度筛选（仅桌面版显示） -->
        <div id="statusFilterControl" class="sort-control" style="display:none;">
          <label class="sort-label" for="statusFilterSelect">我的进度</label>
          <select id="statusFilterSelect" class="sort-select"></select>
        </div>
      </div>
      <!-- 视图容器 -->
      <div id="viewContainer" class="view-container"></div>
      <!-- 兼容冒烟测试的旧列表容器 -->
      <div id="jobList" class="job-list" style="display:none;"></div>
      <div id="emptyState" class="empty-state" style="display:none;">
        <div class="empty-icon">—</div>
        <p>没有匹配的招聘信息</p>
        <p class="empty-hint">试试其他关键词或筛选条件</p>
      </div>
    </section>
  </main>

  <!-- 详情抽屉（右侧滑入，移动端全屏）。保留 #detailModal 兼容冒烟测试 -->
  <div id="detailModal" class="drawer" style="display:none;" aria-hidden="true">
    <div class="drawer-backdrop"></div>
    <aside class="drawer-panel" role="dialog" aria-modal="true">
      <button class="drawer-close" id="modalClose" type="button" aria-label="关闭">&times;</button>
      <div id="modalBody" class="drawer-body"></div>
    </aside>
  </div>

  <!-- 页脚 -->
  <footer class="footer">
    <div class="container">
      <p>招聘信息由人工整理，仅供参考。如有疑问请通过内推链接联系对应公司。</p>
    </div>
  </footer>

  <script src="data/jobs.js"></script>
  <script src="js/utils.js"></script>
  <script src="js/job-block.js"></script>
  <script src="js/views/compact-list-view.js"></script>
  <script src="js/views/board-view.js"></script>
  <script src="js/views/table-view.js"></script>
  <script src="js/views/timeline-view.js"></script>
  <script src="js/editor.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
